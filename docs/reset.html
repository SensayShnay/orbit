<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit: new password</title>
<style>:root{--bg:#FBFAF7;--ink:#1A1830;--muted:#5E5B72;--line:#E7E3DA;--accent:#B07A1E;--soft:#F3EEE3;--warn:#B8451F}@media (prefers-color-scheme:dark){:root{--bg:#14131C;--ink:#F2F0EA;--muted:#A9A6B8;--line:#2A2838;--accent:#E9B44C;--soft:#211F2B;--warn:#F08A5D}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:420px;margin:0 auto;padding:56px 22px 80px}h1{font-size:30px;line-height:1.15;margin:0 0 8px}p{color:var(--muted);margin:0 0 18px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}input{width:100%;box-sizing:border-box;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:16px inherit}
button{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:16px;background:var(--accent);color:#fff;font:600 17px inherit;cursor:pointer}button:disabled{opacity:.6}
.msg{min-height:1.4em;margin:12px 0 0;color:var(--warn);font-size:15px}.ok{color:var(--ink)}</style></head>
<body><main>
<h1>Set a new password</h1>
<p id="lead">Type a new password for your Orbit account. Then open Orbit on your phone and sign in with it.</p>
<form id="f" hidden><label for="pw">New password</label><input id="pw" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
<label for="pw2">Type it again</label><input id="pw2" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit" id="go">Save password</button></form>
<p class="msg" id="msg">Checking your link…</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){const C=window.ORBIT_CONFIG,msg=document.getElementById('msg'),f=document.getElementById('f');
 if(!C||!window.supabase){msg.textContent='This page didn’t load properly. Try the link again.';return}
 const sb=supabase.createClient(C.url,C.anonKey,{auth:{persistSession:false,detectSessionInUrl:true}});
 let ready=false;const show=()=>{ready=true;f.hidden=false;msg.textContent='';document.getElementById('pw').focus()};
 sb.auth.onAuthStateChange((ev,s)=>{if((ev==='PASSWORD_RECOVERY'||ev==='SIGNED_IN')&&s)show()});
 setTimeout(async()=>{if(ready)return;const {data}=await sb.auth.getSession();if(data&&data.session){show();return}
   const err=new URLSearchParams(location.hash.slice(1)).get('error_description')||new URLSearchParams(location.search).get('error_description');
   msg.textContent=err?err.replace(/\+/g,' ')+'. Ask for a new link from the sign-in screen in Orbit.':'This link has expired or was already used. In Orbit, tap Forgot your password to get a new one.'},2500);
 f.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;
   if(a.length<8){msg.textContent='Use at least 8 characters.';return}if(a!==b){msg.textContent='Those two don’t match.';return}
   const btn=document.getElementById('go');btn.disabled=true;msg.textContent='Saving…';
   const {error}=await sb.auth.updateUser({password:a});
   if(error){btn.disabled=false;msg.textContent=error.message;return}
   f.hidden=true;document.getElementById('lead').textContent='Done.';msg.className='msg ok';msg.textContent='Your password is saved. Open Orbit on your phone, tap “I already have an account” and sign in with the new one.';await sb.auth.signOut()}})();
</script></main></body></html>
